<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<style>
  :root{ --pg1:#a83e00; --pg2:#e07b00; --pg3:#f7b733; --pg4:#c25e00;
    --gold:#f5b301; --pill1:#ffd34d; --pill2:#f5a623; --pilltxt:#5a3200;
    --badge:#101c4a; --panel:#05081c; --panelRGB:5,8,25;
    --b3:#2f80ff; --b3g:rgba(47,128,255,.45); --b3a:#3f8cff; --b3b:#1663d9;
    --b4:#22c55e; --b4g:rgba(34,197,94,.45); --b4a:#34d968; --b4b:#149a4c;
    --live:#e8001d; --sub1:#ff2d2d; --sub2:#c00f0f;
    --title:#fff; --digit:#0a1a4a; --numbg:#fff; --numtxt:#101c4a; --ticker:#ffd34d;
    --a1:#ffb300; --a2:#ff7300; --aSoft:rgba(255,170,0,.25);
    --f1:#8a4a00; --f2:#5e3000; --f3:#3a1d00; }
  body[data-theme="georgia"]{ --a1:#37d67a; --a2:#0a8f4d; --aSoft:rgba(55,214,122,.25);
    --f1:#14532d; --f2:#0b3b20; --f3:#072a16; }
  body[data-theme="newyork"]{ --a1:#4da3ff; --a2:#0b5ed7; --aSoft:rgba(77,163,255,.25);
    --f1:#14407c; --f2:#0d2c58; --f3:#081c3a; }
  body[data-theme="tennessee"]{ --a1:#ff5d5d; --a2:#c00f2d; --aSoft:rgba(255,93,93,.25);
    --f1:#7d1420; --f2:#57101a; --f3:#380a10; }
  body[data-theme="texas"]{ --a1:#b57bff; --a2:#6a1fd0; --aSoft:rgba(181,123,255,.25);
    --f1:#4b1d8f; --f2:#33135f; --f3:#200a3d; }
  body[data-theme="maryland"]{ --a1:#2fe0c0; --a2:#0a8f7a; --aSoft:rgba(47,224,192,.25);
    --f1:#0f5c52; --f2:#0a3f38; --f3:#062a25; }
  body[data-theme="newjersey"]{ --a1:#8ea2ff; --a2:#3b4fd6; --aSoft:rgba(142,162,255,.25);
    --f1:#26307d; --f2:#1a2158; --f3:#101538; }
  body.hide-tools .toolbtn{ display:none; }
  .mnum, .mnum *{ color:var(--numtxt) !important; -webkit-text-fill-color:var(--numtxt) !important; background:transparent !important; font:inherit; }
  .mnum{ background:var(--numbg) !important; }
  .mtime, .mtime *{ color:var(--pilltxt) !important; -webkit-text-fill-color:var(--pilltxt) !important; background:transparent !important; font:inherit; }
  .mtime{ background:linear-gradient(180deg,var(--pill1),var(--pill2)) !important; }
  .dball, .dball *{ color:var(--digit) !important; -webkit-text-fill-color:var(--digit) !important; }
  .dball *{ background:transparent !important; font:inherit; }
  .dball::selection, .mnum::selection, .mtime::selection, .mnum *::selection{ background:#3b82f6; color:#fff; -webkit-text-fill-color:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family:"Arial Black","Arial Bold",Arial,sans-serif; color:#fff;
    background:
      radial-gradient(700px 420px at 8% 12%, rgba(255,215,130,.45), transparent 60%),
      radial-gradient(560px 560px at 92% 88%, rgba(255,150,40,.35), transparent 60%),
      radial-gradient(340px 340px at 72% 6%, rgba(255,230,160,.30), transparent 60%),
      radial-gradient(420px 420px at 25% 95%, rgba(200,90,0,.35), transparent 60%),
      linear-gradient(160deg, var(--pg1) 0%, var(--pg2) 38%, var(--pg3) 65%, var(--pg4) 100%);
  }
  .board{ width:1920px; height:1080px; position:relative; padding:22px;
    display:flex; flex-direction:column; gap:16px; }
  .board::before{ content:""; position:absolute; inset:0; pointer-events:none; opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.10) 2px, transparent 2.5px);
    background-size:36px 36px; }

  /* ---------- top bar ---------- */
  .topbar{ z-index:2; display:flex; align-items:center; justify-content:space-between; }
  .badge{ display:flex; align-items:center; gap:14px; background:var(--badge); border:5px solid var(--gold);
    border-radius:20px; padding:10px 30px 10px 18px; box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .badge .logoimg{ width:78px; height:78px; border-radius:50%; object-fit:cover; background:#fff;
    box-shadow:0 0 16px rgba(245,179,1,.55); }
  .badge .bt{ line-height:1.05; }
  .badge .b1{ font-size:60px; color:var(--gold); letter-spacing:3px;
    text-shadow:0 3px 0 rgba(0,0,0,.5), 0 0 22px rgba(245,179,1,.65); }
  .badge .b2{ font-size:22px; color:#fff; letter-spacing:8px; }
  .cdpill{ display:flex; align-items:center; gap:16px; background:rgba(var(--panelRGB),.88);
    border:4px solid var(--a1); border-radius:20px; padding:8px 30px; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .cdpill .cdl{ font-size:26px; letter-spacing:2px; color:var(--a1); }
  #cd{ font-size:52px; font-variant-numeric:tabular-nums; }
  .cdpill.done #cd{ color:#ff2d2d; animation:blink .6s infinite; }
  .tright{ display:flex; align-items:center; gap:14px; }
  .datepill{ background:rgba(var(--panelRGB),.88); border:4px solid var(--gold); border-radius:18px;
    font-size:34px; padding:10px 26px; font-variant-numeric:tabular-nums; }
  .live-badge{ display:inline-flex; align-items:center; gap:8px; background:var(--live);
    font-size:26px; letter-spacing:3px; padding:12px 26px; border-radius:30px;
    box-shadow:0 0 18px rgba(255,0,30,.8); }
  .live-dot{ width:18px; height:18px; border-radius:50%; background:#fff; animation:blink 1.1s infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }

  /* ---------- main ---------- */
  .main{ z-index:2; flex:1; display:flex; gap:18px; min-height:0; }
  .sidecol{ width:440px; display:flex; flex-direction:column; gap:14px; }
  .mini{ flex:1; background:rgba(var(--panelRGB),.94); border:3px solid #2a3f8f; border-radius:18px;
    overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
    box-shadow:0 6px 16px rgba(0,0,0,.5); min-height:0; }
  .mini.active{ border-color:#fff; box-shadow:0 0 22px var(--aSoft); }
  .mhead{ font-size:30px; letter-spacing:1px; text-align:center; padding:8px 4px; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.4); }
  .mrows{ flex:1; display:flex; flex-direction:column; gap:8px; padding:10px 12px 12px; min-height:0; }
  .mrow{ flex:1; display:flex; gap:8px; min-height:0; }
  .mnum{ flex:1; background:var(--numbg); border-radius:12px; color:var(--numtxt);
    display:flex; align-items:center; justify-content:center;
    font-size:48px; cursor:text; outline:none; font-variant-numeric:tabular-nums; white-space:nowrap;
    min-width:0;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.12); }
  .mnum:hover,.mnum:focus{ box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), 0 0 0 4px var(--a1); }
  .mtime{ background:linear-gradient(180deg,var(--pill1),var(--pill2)); color:var(--pilltxt); border-radius:12px;
    display:flex; align-items:center; justify-content:center; padding:0 10px;
    font-size:24px; cursor:text; outline:none; font-variant-numeric:tabular-nums;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.15); }

  /* ---------- featured ---------- */
  .center{ flex:1; min-width:0; }
  .featured{ height:100%; border-radius:26px; padding:26px 34px;
    background:radial-gradient(800px 500px at 50% 0%, var(--f1) 0%, var(--f2) 55%, var(--f3) 100%);
    border:6px solid var(--gold);
    box-shadow:0 12px 40px rgba(0,0,0,.55), 0 0 40px var(--aSoft), inset 0 2px 0 rgba(255,255,255,.25);
    display:flex; flex-direction:column; align-items:center; }
  .feat-title{ font-size:82px; letter-spacing:2px; color:var(--title); outline:none; line-height:1.05; white-space:nowrap;
    text-shadow:0 4px 0 rgba(0,0,0,.5), 0 0 24px rgba(245,179,1,.35); text-align:center; }
  .feat-sub{ background:linear-gradient(180deg,var(--pill1),var(--pill2)); color:var(--pilltxt);
    font-size:32px; letter-spacing:1px; border-radius:30px; padding:6px 38px; margin:10px 0 12px;
    outline:none; box-shadow:0 4px 0 rgba(0,0,0,.25); }
  .feat-clock{ background:var(--panel); border:3px solid var(--gold); border-radius:16px;
    font-size:52px; padding:4px 34px; font-variant-numeric:tabular-nums; margin-bottom:14px; }
  .balls{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:34px; width:100%; }
  .brow{ display:flex; justify-content:center; }
  .bgroup{ text-align:center; }
  .blabel{ display:inline-block; color:#fff; font-size:34px; letter-spacing:3px;
    border-radius:16px; padding:6px 40px; margin-bottom:14px;
    box-shadow:0 4px 0 rgba(0,0,0,.3); text-shadow:0 2px 0 rgba(0,0,0,.25); }
  .blabel.b3{ background:linear-gradient(180deg,var(--b3a),var(--b3b)); }
  .blabel.b4{ background:linear-gradient(180deg,var(--b4a),var(--b4b)); }
  .dballs{ display:flex; justify-content:center; }
  #db3{ gap:16px; }
  #db4{ gap:16px; }
  .dball{ border-radius:22px; cursor:text; outline:none;
    background:linear-gradient(180deg,#ffffff 0%,#eef1f6 60%,#dbe1ea 100%);
    border-style:solid;
    box-shadow:0 10px 22px rgba(0,0,0,.45), inset 0 -8px 0 rgba(0,0,0,.06);
    display:flex; align-items:center; justify-content:center; color:var(--digit);
    font-variant-numeric:tabular-nums;
    width:160px; height:160px; font-size:104px; }
  #db3 .dball{ border-width:10px; border-color:var(--b3); box-shadow:0 10px 22px rgba(0,0,0,.45), 0 0 26px var(--b3g); }
  #db4 .dball{ border-width:10px; border-color:var(--b4); box-shadow:0 10px 22px rgba(0,0,0,.45), 0 0 26px var(--b4g); }
  .dball:hover,.dball:focus{ box-shadow:0 10px 22px rgba(0,0,0,.45), 0 0 0 6px #ffffff88; }

  /* ---------- bottom bar ---------- */
  .bottombar{ z-index:2; background:var(--panel); border:3px solid var(--gold); border-radius:18px;
    display:flex; align-items:center; gap:18px; padding:10px 24px; }
  .soc{ width:48px; height:48px; border-radius:50%; display:inline-flex; align-items:center;
    justify-content:center; font-size:26px; }
  .fb{ background:#1877f2; } .tt{ background:#222; border:2px solid #fff; }
  .ig{ background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7); } .yt{ background:#ff0000; }
  #handle{ font-family:Arial,sans-serif; font-weight:bold; font-size:30px; outline:none; }
  .bspacer{ flex:1; }
  .hint{ font-family:Arial,sans-serif; font-size:19px; color:#8fa0d8; }
  .hint b{ color:var(--gold); }
  .subbtn{ background:linear-gradient(180deg,var(--sub1),var(--sub2)); color:#fff; border:none;
    font-family:"Arial Black",Arial,sans-serif; font-size:26px; letter-spacing:1px;
    border-radius:16px; padding:10px 30px; cursor:pointer; outline:none;
    box-shadow:0 4px 0 rgba(0,0,0,.35); }
  .toolbtn{ background:var(--badge); color:#fff; border:3px solid var(--gold); border-radius:14px;
    font-size:26px; padding:8px 14px; cursor:pointer; outline:none; }
  .toolbtn.on{ border-color:#37d67a; box-shadow:0 0 12px rgba(55,214,122,.7); }
  .ticker{ flex:1; overflow:hidden; display:flex; align-items:center; min-width:0; }
  .ticker-track{ display:flex; width:max-content; animation:tick 16s linear infinite; }
  .ticker-track:focus-within{ animation-play-state:paused; }
  .ticker-track span{ font-size:30px; color:var(--ticker); letter-spacing:2px; white-space:nowrap;
    padding-right:90px; outline:none; text-shadow:0 2px 0 rgba(0,0,0,.4); }
  @keyframes tick{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
</style>
</head>

    '3': { theme:'newyork',   state:'NEW YORK', sub:'New York Result' },
    '4': { theme:'tennessee', state:'TENNESSEE',sub:'Tennessee Result' }
  };
  const THEME_FOR = { 'FLORIDA':'florida', 'GEORGIA':'georgia', 'NEW YORK':'newyork', 'TENNESSEE':'tennessee',
                      'TEXAS':'texas', 'MARYLAND':'maryland', 'NEW JERSEY':'newjersey' };
  let customBg = '';   // '' = use the state's theme colour
  const STATES = [
    { name:'TENNESSEE', color:'#2f80ff', col:'left',
      rows:[['---','12:59'],['---','14:59'],['---','17:59']] },
    { name:'TEXAS', color:'#8b2ff7', col:'left',

    { name:'MARYLAND', color:'#22b573', col:'left',

      rows:[['---','12:59'],['---','15:59']] },
    { name:'NEW JERSEY', color:'#1f6feb', col:'right',
      rows:[['---','12:45'],['---','--:--']] },
    { name:'FLORIDA', color:'#22b573', col:'right',
      rows:[['---','12:59'],['---','15:59']] },
    { name:'NEW YORK', color:'#17a2b8', col:'right',
      rows:[['---','14:30'],['---','17:30']] }
  ];
  function titleCase(s){ return s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }
  function applyTheme(name){
    document.body.dataset.theme = name;
    document.body.style.removeProperty('--f1');
    document.body.style.removeProperty('--f2');
    document.body.style.removeProperty('--f3');
    applyBg();
  }
  function applyBg(){
    if(!customBg) return;
    document.body.style.setProperty('--f1', customBg);
    document.body.style.setProperty('--f2', shade(customBg, .62));
    document.body.style.setProperty('--f3', shade(customBg, .34));
  }
  function fitMini(el){
    el.style.fontSize = '';
    let s = 48;
    while(el.scrollWidth > el.clientWidth + 1 && s > 18){ s -= 2; el.style.fontSize = s + 'px'; }
  }
  function fitAllMini(){ document.querySelectorAll('.mnum').forEach(fitMini); }
  function fitTitle(){
    const t = document.getElementById('featTitle');
    let s = 82;
    t.style.fontSize = s + 'px';
    while(t.scrollWidth > t.clientWidth + 4 && s > 44){ s -= 2; t.style.fontSize = s + 'px'; }
  }
  function setFeatured(name){
    document.getElementById('featTitle').textContent = 'REZILTA ' + name;
    document.getElementById('featSub').textContent = titleCase(name) + ' Result';
    document.querySelectorAll('.mini').forEach(m => {
      m.classList.toggle('active', m.querySelector('.mhead').textContent === name);
    });
    document.querySelectorAll('.dball').forEach(b => { b.textContent = ''; });
    fitTitle();
    if (window.__syncReady) schedulePush();
  }
  document.getElementById('featTitle').addEventListener('input', fitTitle);
  function makeMini(st){
    const d = document.createElement('div');
    d.className = 'mini';
    let rowsHtml = '';
    st.rows.forEach(r => {
      rowsHtml += '<div class="mrow"><div class="mnum" contenteditable="true" spellcheck="false">' + r[0] +
        '</div><div class="mtime" contenteditable="true" spellcheck="false">' + r[1] + '</div></div>';
    });
    d.innerHTML = '<div class="mhead" data-def="' + st.color + '" style="background:' + st.color + '">' + st.name + '</div>' +
      '<div class="mrows">' + rowsHtml + '</div>';
    d.addEventListener('click', e => {
      if (e.target.isContentEditable) return;
      applyTheme(THEME_FOR[st.name] || 'florida');
      setFeatured(st.name);
    });
    return d;
  }
  const colLeft = document.getElementById('colLeft'), colRight = document.getElementById('colRight');
  STATES.forEach(st => (st.col === 'left' ? colLeft : colRight).appendChild(makeMini(st)));
  setFeatured('FLORIDA');
  fitAllMini();
  document.addEventListener('input', e => { if(e.target.classList && e.target.classList.contains('mnum')) fitMini(e.target); });

  document.addEventListener('keydown', e => {
    if (e.target.isContentEditable) return;
    const t = THEMES[e.key];
    if (t) { applyTheme(t.theme); setFeatured(t.state); }
  });

  function tick(){
    const n = new Date(), p = x => String(x).padStart(2,'0');
    document.getElementById('clock').textContent = p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
    document.getElementById('date').textContent = p(n.getDate())+'.'+p(n.getMonth()+1)+'.'+n.getFullYear();
  }
  tick(); setInterval(tick,1000);

  let cdEnd = null;
  const cdEl = document.getElementById('cd'), cdBox = document.getElementById('cdbox');
  cdBox.addEventListener('click', () => {
    const m = prompt('Konbyen minit avan prochen tiraj la?', '30');
    const mins = parseInt(m, 10);
    if (!isNaN(mins) && mins > 0) { cdEnd = Date.now() + mins*60000; cdBox.classList.remove('done'); if (window.__syncReady && SYNC.url) schedulePush(); }
  });
  setInterval(() => {
    if (!cdEnd) return;
    let s = Math.max(0, Math.round((cdEnd - Date.now())/1000));
    const p = x => String(x).padStart(2,'0');
    cdEl.textContent = p(Math.floor(s/60)) + ':' + p(s%60);
    if (s === 0) { cdBox.classList.add('done'); cdEl.textContent = 'LIVE!'; cdEnd = null; }
  }, 500);

  /* ---------- custom background color ---------- */
  function shade(hex, f){
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n>>16)&255)*f), g = Math.round(((n>>8)&255)*f), b = Math.round((n&255)*f);
    return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  const bgpick = document.getElementById('bgpick');
  document.getElementById('colorBtn').addEventListener('click', () => bgpick.click());
  bgpick.addEventListener('input', e => {
    customBg = e.target.value;
    applyBg();
    if (window.__syncReady && SYNC.url) schedulePush();
  });

  /* ---------- phone sync via Firebase ----------
     Easiest setup: paste your Firebase Realtime Database URL below (and a secret channel name).
     The same two values go into the phone remote page.
     You can also override them with  ?fb=...&ch=...  on the URL.  Add  ?edit  to show the toolbar buttons. */
  const CONFIG = {
    firebaseUrl: 'https://awel-board-default-rtdb.firebaseio.com',
    channel:     'awel-3380ce0ba2'      // use a long random name — it is the only "password" for this board
  };

  let customColors = {};
  function hex2rgb(h){ const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; }
  function rgb2hex(r,g,b){ return '#' + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
  function mix(h, t, f){ const a = hex2rgb(h), b = hex2rgb(t); return rgb2hex(...a.map((x,i) => Math.round(x + (b[i]-x)*f))); }
  function isHex(v){ return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v); }
  function lum(h){ const c = hex2rgb(h); return (0.299*c[0] + 0.587*c[1] + 0.114*c[2]) / 255; }
  function applyColors(c){
    c = c || {};
    const R = document.documentElement.style;
    const set = (k, v) => { if(v) R.setProperty(k, v); else R.removeProperty(k); };
    const g = k => isHex(c[k]) ? c[k] : null;
    let v = g('page');
    set('--pg1', v && shade(v,.75)); set('--pg2', v); set('--pg3', v && mix(v,'#ffffff',.35)); set('--pg4', v && shade(v,.86));
    set('--gold', g('gold'));
    v = g('pill'); set('--pill1', v && mix(v,'#ffffff',.3)); set('--pill2', v); set('--pilltxt', v && (lum(v) > .6 ? '#3a2300' : '#ffffff'));
    set('--badge', g('badge'));
    v = g('panel'); set('--panel', v); set('--panelRGB', v && hex2rgb(v).join(','));
    ['3','4'].forEach(n => {
      const q = g('ball' + n);
      set('--b'+n, q); set('--b'+n+'g', q && 'rgba(' + hex2rgb(q).join(',') + ',.45)');
      set('--b'+n+'a', q && mix(q,'#ffffff',.2)); set('--b'+n+'b', q && shade(q,.75));
    });
    set('--live', g('live'));
    v = g('sub'); set('--sub1', v && mix(v,'#ffffff',.15)); set('--sub2', v && shade(v,.78));
    ['title','digit','numbg','numtxt','ticker'].forEach(k => set('--' + k, g(k)));
    const hd = c.hdr || {};
    document.querySelectorAll('.mhead').forEach(h => {
      const n = h.textContent.trim();
      h.style.background = isHex(hd[n]) ? hd[n] : h.dataset.def;
    });
  }

  const SYNC = { url:'', channel:'awel1', lastTs:0, timer:null, pushT:null, hb:null };
  const qp = new URLSearchParams(location.search);
  try {
    const s = JSON.parse(localStorage.getItem('awelSync') || '{}');
    if (s.url) { SYNC.url = s.url; SYNC.channel = s.channel || 'awel1'; }
  } catch(e){}
  if (CONFIG.firebaseUrl) { SYNC.url = CONFIG.firebaseUrl; SYNC.channel = CONFIG.channel || 'awel1'; }
  if (qp.get('fb')) { SYNC.url = qp.get('fb'); SYNC.channel = qp.get('ch') || SYNC.channel; }
  SYNC.url = (SYNC.url || '').trim();
  if (SYNC.url && !qp.has('edit')) document.body.classList.add('hide-tools');   // keep buttons off the stream

  const syncBtn = document.getElementById('syncBtn');
  const subBtn = document.getElementById('subbtn');
  function nodeUrl(sub){ return SYNC.url.replace(/\/+$/,'') + '/boards/' + encodeURIComponent(SYNC.channel) + (sub || '') + '.json'; }
  function digits(id){ let s=''; document.querySelectorAll('#'+id+' .dball').forEach(b=>{ s += b.textContent.trim(); }); return s; }
  function setDigits(id, str){
    const balls = document.querySelectorAll('#'+id+' .dball');
    str = String(str == null ? '' : str);
    balls.forEach((b,i)=>{ if(document.activeElement !== b) b.textContent = str[i] || ''; });
  }
  function selectAll(el){
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function arr(x){            // Firebase may hand arrays back as {0:..,1:..}
    if (Array.isArray(x)) return x;
    if (x && typeof x === 'object') return Object.keys(x).sort((a,b)=>a-b).map(k => x[k]);
    return [];
  }
  function collectState(by){
    const states = {};
    document.querySelectorAll('.mini').forEach(m => {
      const name = m.querySelector('.mhead').textContent.trim();
      const rows = [];
      m.querySelectorAll('.mrow').forEach(r => {
        rows.push([r.querySelector('.mnum').textContent, r.querySelector('.mtime').textContent]);
      });
      states[name] = rows;
    });
    return { ts: Date.now(), by: by, states: states,
      cdEnd: cdEnd || 0, bg: customBg || '', colors: customColors,
      ticker: document.querySelector('#tickerTrack span').textContent,
      subtxt: subBtn.textContent,
      featured: { title: document.getElementById('featTitle').textContent,
        sub: document.getElementById('featSub').textContent,
        theme: document.body.dataset.theme,
        p3: digits('db3'), p4: digits('db4') } };
  }
  function pushState(){
    if(!SYNC.url) return;
    const d = collectState('board');
    SYNC.pushing = true;
    fetch(nodeUrl(), { method:'PATCH', body: JSON.stringify(d) })
      .then(r => { if(r.ok){ SYNC.lastTs = d.ts; SYNC.failed = false; } else { SYNC.failed = true; console.warn('AWEL sync: save refused (' + r.status + ') - check Firebase rules'); } })
      .catch(() => { SYNC.failed = true; })
      .then(() => { SYNC.pushing = false; syncBtn.style.borderColor = SYNC.failed ? '#ff3b3b' : ''; if(SYNC.failed) setTimeout(schedulePush, 5000); });
  }
  function schedulePush(){ SYNC.editAt = Date.now(); clearTimeout(SYNC.pushT); SYNC.pushT = setTimeout(pushState, 700); }

  function applyRemote(d){
    // any NEW timestamp means "something changed" (we don't compare clocks between devices)
    if(!d || typeof d.ts !== 'number' || d.ts === SYNC.lastTs) return;
    if(SYNC.pushing || SYNC.failed || (SYNC.editAt && Date.now() - SYNC.editAt < 5000)) return;   // our own edit is on its way: don't overwrite it
    SYNC.lastTs = d.ts;
    if(d.states){
      document.querySelectorAll('.mini').forEach(m => {
        const name = m.querySelector('.mhead').textContent.trim();
        const rows = d.states[name] ? arr(d.states[name]) : null;
        if(!rows) return;
        m.querySelectorAll('.mrow').forEach((r,i) => {
          const row = rows[i] ? arr(rows[i]) : null;
          if(row){
            const nEl = r.querySelector('.mnum'), tEl = r.querySelector('.mtime');
            if(row[0] != null && document.activeElement !== nEl) nEl.textContent = row[0];
            if(row[1] != null && document.activeElement !== tEl) tEl.textContent = row[1];
          }
        });
      });
    }
    if(typeof d.bg === 'string'){ customBg = d.bg; }
    customColors = (d.colors && typeof d.colors === 'object') ? d.colors : {};
    applyColors(customColors);
    if(d.featured){
      const f = d.featured;
      if(f.title){ document.getElementById('featTitle').textContent = f.title; }
      if(f.sub) document.getElementById('featSub').textContent = f.sub;
      setDigits('db3', f.p3); setDigits('db4', f.p4);
      if(f.theme) applyTheme(f.theme); else applyTheme(document.body.dataset.theme);
      fitTitle();
      const nm = String(f.title || '').replace(/^REZILTA\s+/, '').trim();
      document.querySelectorAll('.mini').forEach(m => {
        m.classList.toggle('active', m.querySelector('.mhead').textContent.trim() === nm);
      });
    } else { applyTheme(document.body.dataset.theme); }
    if(typeof d.ticker === 'string'){
      const sp = document.querySelectorAll('#tickerTrack span');
      if(document.activeElement !== sp[0]) sp.forEach(x => { x.textContent = d.ticker; });
    }
    if(typeof d.subtxt === 'string' && document.activeElement !== subBtn) subBtn.textContent = d.subtxt;
    if(typeof d.cdEnd === 'number'){
      if(d.cdEnd > Date.now()){ cdEnd = d.cdEnd; cdBox.classList.remove('done'); }
      else if(d.cdEnd > 0 && Date.now() - d.cdEnd < 120000){ cdEnd = null; cdBox.classList.add('done'); cdEl.textContent = 'LIVE!'; }
      else { cdEnd = null; cdBox.classList.remove('done'); cdEl.textContent = '--:--'; }
    }
    fitAllMini();
    // tell the phone it arrived
    fetch(nodeUrl('/ack'), { method:'PUT', body: JSON.stringify(d.ts) }).catch(()=>{});
  }
  function pollRemote(){
    if(!SYNC.url) return;
    fetch(nodeUrl() + '?t=' + Date.now(), {cache:'no-store'}).then(r => r.json()).then(applyRemote).catch(()=>{});
  }
  function heartbeat(){
    fetch(nodeUrl('/seen'), { method:'PUT', body: JSON.stringify(Date.now()) }).catch(()=>{});
  }
  function startSync(){
    clearInterval(SYNC.timer); clearInterval(SYNC.hb);
    if(!SYNC.url){ syncBtn.classList.remove('on'); return; }
    syncBtn.classList.add('on');
    syncBtn.title = 'Telefòn konekte (' + SYNC.channel + ') — klike pou chanje';
    // PULL first: a reloaded OBS source must never wipe the results already on the server.
    fetch(nodeUrl() + '?t=' + Date.now(), {cache:'no-store'}).then(r => r.json())
      .then(d => { if(d == null) pushState(); else applyRemote(d); })
      .catch(()=>{});
    SYNC.timer = setInterval(pollRemote, 2000);
    heartbeat(); SYNC.hb = setInterval(heartbeat, 10000);
  }
  syncBtn.addEventListener('click', () => {
    const url = prompt('Firebase Database URL\n(ex: https://xxx-default-rtdb.firebaseio.com)', SYNC.url || '');
    if(url === null) return;
    const channel = prompt('Chwazi yon non chanèl sekrè\n(mete menm nan sou telefòn nan)', SYNC.channel || 'awel1');
    if(channel === null) return;
    SYNC.url = (url || '').trim();
    SYNC.channel = (channel || 'awel1').trim() || 'awel1';
    try { localStorage.setItem('awelSync', JSON.stringify({url: SYNC.url, channel: SYNC.channel})); } catch(e){}
    startSync();
  });
  document.addEventListener('input', e => {
    if(e.target.isContentEditable && SYNC.url) schedulePush();
  });
  window.__syncReady = true;
  if(SYNC.url) startSync();

  /* ---------- per-digit balls: type, auto-advance, paste ---------- */
  const allBalls = [...document.querySelectorAll('.dball')];
  allBalls.forEach(b => {
    b.addEventListener('input', () => {
      const d = b.textContent.replace(/\D/g, '').slice(-1);
      if(b.textContent !== d) b.textContent = d;
      if(d){
        const nx = allBalls[allBalls.indexOf(b)+1];
        if(nx){ nx.focus(); selectAll(nx); }
      }
    });
    b.addEventListener('keydown', e => {
      if(e.key === 'Backspace' && !b.textContent){
        const pv = allBalls[allBalls.indexOf(b)-1];
        if(pv){ e.preventDefault(); pv.focus(); selectAll(pv); }
      }
    });
    b.addEventListener('paste', e => {
      e.preventDefault();
      const ds = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
      if(!ds) return;
      const start = allBalls.indexOf(b);
      ds.split('').forEach((ch,k) => { const t = allBalls[start+k]; if(t) t.textContent = ch; });
      const nx = allBalls[start + ds.length];
      if(nx){ nx.focus(); selectAll(nx); }
      schedulePush();
    });
    b.addEventListener('focus', () => selectAll(b));
  });

  /* ---------- plain-text editing: the browser must not add its own styled spans ---------- */
  document.querySelectorAll('.mnum, .mtime, .dball').forEach(el => {
    el.setAttribute('contenteditable', 'plaintext-only');
    el.addEventListener('blur', () => { if(el.children.length) el.textContent = el.textContent; });
  });

  /* ---------- side cards: click = select all, Enter = done ---------- */
  document.addEventListener('focusin', e => {
    if(e.target.classList && (e.target.classList.contains('mnum') || e.target.classList.contains('mtime'))) selectAll(e.target);
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Enter' && e.target.classList && (e.target.classList.contains('mnum') || e.target.classList.contains('mtime'))){
      e.preventDefault(); e.target.blur();
    }
  });

  /* ---------- ticker: keep the two copies in sync ---------- */
  const tickSpans = document.querySelectorAll('#tickerTrack span');
  if(tickSpans.length === 2){
    tickSpans[0].addEventListener('input', () => { tickSpans[1].textContent = tickSpans[0].textContent; });
  }
</script>
</body>
</html>
